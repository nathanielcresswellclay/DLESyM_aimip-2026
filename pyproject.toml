[project]
name = "dlesym"
version = "0.1.0"
description = "uv environment reproducing the dlesym-0.1 conda environment for DLESyM"
requires-python = "==3.10.*"
dependencies = [
    # --- Deep learning (PyPI wheels for torch 1.13.0 on Linux ship CUDA 11.7 + cuDNN 8.5) ---
    "torch==1.13.0",
    "torchvision==0.14.0",
    "torchaudio==0.13.0",
    "torchinfo==1.7.2",
    "tensorboard==2.11.0",
    "protobuf==3.20.1",
    "einops==0.4.1",
    "hydra-core==1.2.0",
    "omegaconf==2.2.3",
    "gradient-descent-the-ultimate-optimizer==1.0",
    # --- Core numerics / data ---
    "numpy==1.23.4",
    "scipy==1.11.2",
    "pandas==1.5.1",
    "xarray==2022.11.0",
    "dask==2022.11.1",
    "distributed==2022.11.1",
    "zarr==2.13.3",
    "numcodecs==0.10.2",
    "fsspec==2022.11.0",
    "bottleneck==1.3.5",
    "numexpr==2.8.4",
    "netCDF4==1.5.8",
    "cftime==1.5.1.1",
    "h5py==3.11.0",
    "statsmodels==0.14.2",
    "patsy==0.5.6",
    # --- Geospatial / HEALPix / astro ---
    "healpy==1.16.5",
    "astropy==5.3.2",
    "astropy-healpix==1.0.0",
    "reproject==0.11.0",
    "cartopy==0.22.0",
    "pyproj==3.3.1",
    "shapely==1.8.4",
    "pyshp==2.3.1",
    # --- Verification / skill metrics ---
    "xskillscore==0.0.26",
    "xhistogram==0.3.2",
    "properscoring==0.1",
    "skillmetrics==1.2.4",
    # --- Plotting / imaging ---
    "matplotlib==3.5.2",
    "bokeh==2.4.3",
    "pillow==9.2.0",
    "imageio==2.35.1",
    # --- Data access ---
    "cdsapi==0.6.1",
    "acccmip6==5.4.0",
    "requests==2.32.2",
    # --- Misc ---
    "pyyaml==6.0",
    "tqdm==4.64.1",
    "openpyxl==3.1.3",
    "xlrd==2.0.1",
    "xlsxwriter==3.2.0",
    "beautifulsoup4==4.12.3",
    "psutil==5.9.0",
]

[dependency-groups]
interactive = [
    "jupyterlab==4.2.1",
    "notebook==7.2.0",
    "jupyter==1.0.0",
    "ipykernel==6.29.4",
    "ipython==8.24.0",
    "ipywidgets==8.1.2",
    "black==23.9.1",
]

[tool.uv]
# Transitive pins carried over from the conda environment
constraint-dependencies = [
    "aiohttp==3.8.1",
    "werkzeug==2.2.2",
    "markdown==3.4.1",
    "grpcio==1.42.0",
    "google-auth==2.15.0",
    "jinja2==3.1.2",
    "markupsafe==2.1.1",
    "cloudpickle==2.2.0",
    "toolz==0.12.0",
    "partd==1.3.0",
    "cytoolz==0.12.0",
    "msgpack==1.0.3",
    "tblib==1.7.0",
    "zict==2.2.0",
    "sortedcontainers==2.4.0",
    "heapdict==1.0.1",
    "locket==1.0.0",
    "click==8.1.3",
    "packaging==23.1",
    "typing-extensions==4.12.0",
]

# The original conda env had tornado 6.4 (pip) alongside distributed 2022.11.1,
# which declares tornado<6.2. This override reproduces that state explicitly.
override-dependencies = [
    "tornado==6.4",
]
